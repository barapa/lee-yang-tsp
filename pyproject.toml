[project]
name = "lee-yang-tsp"
version = "0.1.0"
description = "Lee-Yang zeros of the TSP partition function — novel visualization and hardness prediction"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["ipykernel", "jupyter"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lee_yang_tsp"]
